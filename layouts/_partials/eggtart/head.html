{{- if .Params.math }}
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script defer src="{{ .Site.Params.mathjaxURL | default "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" }}"></script>
{{- end }}

{{- if .Params.mermaid }}
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const mermaidTheme = document.documentElement.dataset.theme === "dark" ? "dark" : "neutral";
mermaid.initialize({
  startOnLoad: true,
  theme: mermaidTheme,
  securityLevel: "strict"
});
</script>
{{- end }}
