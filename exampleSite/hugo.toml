baseURL = "https://example.org/"
title = "Example Notebook"
theme = ["eggtart", "PaperMod"]

[params]
mainSections = ["posts"]
defaultTheme = "auto"
disableSpecial1stPost = true

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[[menus.main]]
name = "posts"
url = ""
weight = 10

[[menus.main]]
name = "series"
url = "series/"
weight = 20

[[menus.main]]
name = "tags"
url = "tags/"
weight = 30

[[menus.main]]
identifier = "rss"
name = ""
title = "RSS"
url = "index.xml"
pre = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img" aria-label="RSS"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>'
weight = 40

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"]]
inline = [["$", "$"]]
